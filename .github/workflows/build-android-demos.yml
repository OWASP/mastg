name: Build All Android Demos

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'demos/android/**'
  pull_request:
    branches:
      - master
    paths:
      - 'demos/**'
      - '.github/workflows/build-android-demos.yml'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: demos/android
          fetch-depth: 0

      - name: Generate matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- 'demos/android/**')"

            echo "Changed files:"
            echo "$changed_files"

            demos="$(echo "$changed_files" \
              | grep -oE '^demos/android/[^/]+/MASTG-DEMO-[^/]+' \
              | sort -u || true)"

            # Drop demos whose directory no longer exists (e.g. removed in the target PR),
            # otherwise the build job fails on the missing directory.
            existing_demos=""
            while IFS= read -r demo; do
              [ -n "$demo" ] || continue
              if [ -d "$demo" ]; then
                existing_demos+="$demo"$'\n'
              else
                echo "Skipping removed demo: $demo"
              fi
            done <<< "$demos"
            demos="$existing_demos"

            # Demos can reuse another demo's files through symbolic links
            # (e.g. MastgTest.kt -> ../MASTG-DEMO-0090/MastgTest.kt). Rebuild the
            # demos whose links point into a changed demo, too.
            if [ -n "$demos" ]; then
              linked=""
              while IFS= read -r link; do
                target_dir="$(cd "$(dirname "$link")" && realpath -m "$(dirname "$(readlink "$(basename "$link")")")")"
                target_rel="${target_dir#"$PWD"/}"
                if printf '%s\n' "$demos" | grep -qxF "$target_rel"; then
                  linked+="$(dirname "$link")"$'\n'
                fi
              done < <(find demos/android -mindepth 3 -maxdepth 3 -type l -path 'demos/android/*/MASTG-DEMO-*/*')
              if [ -n "$linked" ]; then
                echo "Also rebuilding demos that link to changed demos:"
                printf '%s' "$linked" | sort -u
              fi
              demos="$(printf '%s%s' "$demos" "$linked" | sed '/^$/d' | sort -u)"
            fi
          else
            demos="$(find demos/android -mindepth 2 -maxdepth 2 -type d -name 'MASTG-DEMO-*' | sort)"
          fi

          matrix="$(printf '%s\n' "$demos" \
            | jq -R 'select(length > 0)' \
            | jq -sc '{demo: .}')"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Print matrix: $matrix"

      - name: Print matrix
        run: echo '${{ steps.set-matrix.outputs.matrix }}'

  build-base-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mastestapp_hash: ${{ steps.get-mastestapp-hash.outputs.mastestapp_hash }}

    steps:
      - name: Get last commit hash of mas-app-android
        id: get-mastestapp-hash
        shell: bash
        run: |
          set -euo pipefail

          hash="$(git ls-remote https://github.com/cpholguera/mas-app-android.git HEAD | awk '{print $1}')"

          echo "mastestapp_hash=$hash" >> "$GITHUB_OUTPUT"
          echo "MASTESTAPP_HASH=$hash" >> "$GITHUB_ENV"

      - name: Check if already cached
        id: cache-check
        uses: actions/cache/restore@v5
        with:
          lookup-only: true
          path: mas-app-android/
          key: base-app-${{ steps.get-mastestapp-hash.outputs.mastestapp_hash }}

      - name: Set up JDK 17
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Accept Android SDK licenses
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Clone mas-app-android repository
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: cpholguera/mas-app-android
          path: mas-app-android
          ref: ${{ steps.get-mastestapp-hash.outputs.mastestapp_hash }}

      - name: Build base app
        if: steps.cache-check.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd mas-app-android

          grep -q 'org.gradle.caching=true' gradle.properties \
            || echo -en "\norg.gradle.caching=true\norg.gradle.configuration-cache=true\n" >> gradle.properties

          ./gradlew assembleDebug --stacktrace

          echo "Build succeeded"

      - name: Saving cache
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: mas-app-android/
          key: base-app-${{ steps.get-mastestapp-hash.outputs.mastestapp_hash }}

  build:
    needs:
      - generate-matrix
      - build-base-app
    if: ${{ needs.generate-matrix.outputs.matrix != '{"demo":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      max-parallel: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: demos/android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Restore base app cache
        id: cache-base-app
        uses: actions/cache/restore@v5
        with:
          path: mas-app-android/
          key: base-app-${{ needs.build-base-app.outputs.mastestapp_hash }}
          fail-on-cache-miss: true

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          demo="${{ matrix.demo }}"
          demo_id="$(basename "$demo")"

          # apk-build.sh (from mas-app-android) applies the demo's files to a temporary
          # copy of the base app and builds a debug APK. The package defaults to
          # org.owasp.mastestapp.<demo id without dashes, lowercased> and the app name to
          # the demo folder name, so the APK is apk-out/<demo id>/<demo id>.apk.
          mas-app-android/tools/apk-build.sh "$demo" --output apk-out

          echo "APK_NAME=${demo_id}.apk" >> "$GITHUB_ENV"
          echo "APK_PATH=apk-out/${demo_id}/${demo_id}.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
