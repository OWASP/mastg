name: Markdown Linter

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  markdown-lint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run markdownlint
        run: npm run lint:markdown

