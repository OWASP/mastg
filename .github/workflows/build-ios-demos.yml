name: Build All iOS Demos

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'demos/ios/**'
  pull_request:
    branches:
      - master
    paths:
      - 'demos/**'
      - '.github/workflows/build-ios-demos.yml'
jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: demos/ios
          fetch-depth: 2 # Required for git diff in PRs

      - name: Generate matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Get list of changed files in demos/ios/ directory
            changed_files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- 'demos/ios/*')

            echo "Changed files:"
            echo "$changed_files"

            # Extract unique demo directories
            matrix=$(echo "$changed_files" | grep -oE 'demos/ios/[^/]*/MASTG-DEMO-[^/]+' | sort -u | head -c -1 | tr '\n' ' ' | sed 's/ /","/g')

            # If no changes, set empty matrix
            if [ -z "$matrix" ]; then
              echo "matrix={\"demo\":[]}" >> $GITHUB_OUTPUT
            else
              echo "matrix={\"demo\":[\"$matrix\"]}" >> $GITHUB_OUTPUT
            fi
          else
            # Default behavior: include all demos for master branch
            matrix=$(echo demos/ios/*/MASTG-DEMO-* | sed 's/ /","/g')
            echo "matrix={\"demo\":[\"$matrix\"]}" >> $GITHUB_OUTPUT
          fi
          echo "Print matrix: $matrix"

  build:
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix != '{"demo":[]}' }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      max-parallel: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: demos/ios

      - name: Clone mas-app-ios repository
        uses: actions/checkout@v6
        with:
          repository: cpholguera/mas-app-ios
          path: mas-app-ios

      - name: Install dependencies
        run: brew install ldid

      - name: Replace files with demo and prepare build
        run: |
          set -euo pipefail

          demo="${{ matrix.demo }}"
          [ -d "$demo" ] || (
            echo "Demo directory not found: $demo"
            exit 1
          )

          echo "Processing $demo"

          mapfile -t referenced_demo_dirs < <(
            find "$demo" -maxdepth 1 -type f -name 'MASTG-DEMO-*.md' -print0 2>/dev/null \
              | while IFS= read -r -d '' demo_md; do
                  grep -oE '\{\{[^}]+\}\}' "$demo_md" \
                    | sed -E 's/^\{\{\s*|\s*\}\}$//g' \
                    | tr '#' '\n' \
                    | sed -E 's/^\s+|\s+$//g' \
                    | grep -E '^\.\./MASTG-DEMO-[^/]+/.+' \
                    | while IFS= read -r shared_path; do
                        dirname "$(realpath -m "$demo/$shared_path")"
                      done
                done \
              | sort -u
          )

          resolve_source_file() {
            local relative_file="$1"
            local source_file="$demo/$relative_file"

            if [ -f "$source_file" ]; then
              echo "$source_file"
              return 0
            fi

            for shared_dir in "${referenced_demo_dirs[@]}"; do
              source_file="$shared_dir/$relative_file"
              if [ -f "$source_file" ]; then
                echo "$source_file"
                return 0
              fi
            done

            return 1
          }

          copy_if_exists() {
            local relative_file="$1"
            local target_file="$2"
            local label="$3"
            local source_file=""

            if source_file="$(resolve_source_file "$relative_file")"; then
              cp -f "$source_file" "$target_file"
              echo "Copied $label for $demo"
            else
              echo "No $label found for $demo"
            fi
          }

          copy_if_exists MastgTest.swift mas-app-ios/MASTestApp/MastgTest.swift MastgTest.swift
          copy_if_exists Info.plist mas-app-ios/MASTestApp/Info.plist Info.plist

          if entitlements_file="$(resolve_source_file MASTestApp.entitlements)"; then
            echo "EXTRA_ENTITLEMENTS=$GITHUB_WORKSPACE/$entitlements_file" >> "$GITHUB_ENV"
            echo "Found MASTestApp.entitlements for $demo"
          else
            echo "EXTRA_ENTITLEMENTS=" >> "$GITHUB_ENV"
            echo "No MASTestApp.entitlements found for $demo"
          fi

      - name: Build, sign, and package IPA
        run: |
          demo="${{ matrix.demo }}"
          IPA_NAME="$(basename "$demo").ipa"
          
          ./mas-app-ios/.github/scripts/build-and-package.sh "$IPA_NAME" "${EXTRA_ENTITLEMENTS:-}"
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: "${{ env.IPA_NAME }}"
          path: "${{ github.workspace }}/mas-app-ios/output/${{ env.IPA_NAME }}"
          if-no-files-found: error
