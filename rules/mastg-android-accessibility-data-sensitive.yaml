rules:
  - id: mastg-android-accessibility-data-sensitive-xml
    severity: INFO
    languages:
      - xml
    metadata:
      summary: Views with accessibilityDataSensitive attribute in XML layouts
    message: "[MASVS-PLATFORM] View has accessibilityDataSensitive attribute set"
    patterns:
      - pattern: <$VIEW ... android:accessibilityDataSensitive="$VALUE" ...>
      - focus-metavariable: $VALUE

  - id: mastg-android-filter-touches-when-obscured-xml
    severity: INFO
    languages:
      - xml
    metadata:
      summary: Views with filterTouchesWhenObscured providing implicit accessibility protection
    message: "[MASVS-PLATFORM] View has filterTouchesWhenObscured set (provides implicit accessibilityDataSensitive protection on Android 16+)"
    patterns:
      - pattern: <$VIEW ... android:filterTouchesWhenObscured="true" ...>

  - id: mastg-android-set-accessibility-data-sensitive
    severity: INFO
    languages:
      - java
    metadata:
      summary: Programmatic use of setAccessibilityDataSensitive method
    message: "[MASVS-PLATFORM] View's accessibility data sensitivity is being set programmatically"
    pattern-either:
      - pattern: $VIEW.setAccessibilityDataSensitive($VALUE)

  - id: mastg-android-get-accessibility-data-sensitive
    severity: INFO
    languages:
      - java
    metadata:
      summary: Checking accessibility data sensitivity at runtime
    message: "[MASVS-PLATFORM] Code is checking view's accessibility data sensitivity"
    pattern-either:
      - pattern: $VIEW.getAccessibilityDataSensitive()

  - id: mastg-android-set-filter-touches-when-obscured
    severity: INFO
    languages:
      - java
    metadata:
      summary: Programmatic use of setFilterTouchesWhenObscured method
    message: "[MASVS-PLATFORM] View's filterTouchesWhenObscured is being set (provides implicit accessibility protection on Android 16+)"
    pattern-either:
      - pattern: $VIEW.setFilterTouchesWhenObscured($VALUE)

  - id: mastg-android-is-filter-touches-when-obscured
    severity: INFO
    languages:
      - java
    metadata:
      summary: Checking filterTouchesWhenObscured at runtime
    message: "[MASVS-PLATFORM] Code is checking view's filterTouchesWhenObscured state"
    pattern-either:
      - pattern: $VIEW.isFilterTouchesWhenObscured()

  - id: mastg-android-sensitive-view-without-protection
    severity: WARNING
    languages:
      - xml
    metadata:
      summary: Potentially sensitive input fields without accessibility or overlay protection
    message: "[MASVS-PLATFORM] Potentially sensitive view lacks accessibilityDataSensitive or filterTouchesWhenObscured protection"
    patterns:
      - pattern-either:
          - pattern: |
              <EditText
                ...
                android:inputType="textPassword"
                ...>
          - pattern: |
              <EditText
                ...
                android:inputType="numberPassword"
                ...>
          - pattern: |
              <EditText
                ...
                android:inputType="textVisiblePassword"
                ...>
      - pattern-not: <... android:accessibilityDataSensitive="true" ...>
      - pattern-not: <... android:filterTouchesWhenObscured="true" ...>
