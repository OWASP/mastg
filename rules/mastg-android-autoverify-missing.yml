rules:
- id: mastg-android-autoverify-missing
  severity: WARNING
  languages:
    - xml
  metadata:
    summary: This rule looks for insecure deep link configurations.
  message: '[MASVS-PLATFORM] Deep link intent filter missing android:autoVerify="true", enabling malicious apps to hijack links.'
  patterns:
    - pattern-inside: |
        <activity ...>
          ...
        </activity>
    - pattern-either:
        - pattern: |
            <intent-filter ...>
              ...
              <action android:name="android.intent.action.VIEW" />
              ...
              <category android:name="android.intent.category.DEFAULT" />
              ...
              <category android:name="android.intent.category.BROWSABLE" />
              ...
              <data ... android:scheme="https" ... />
              ...
            </intent-filter>
        - pattern: |
            <intent-filter ...>
              ...
              <action android:name="android.intent.action.VIEW" />
              ...
              <category android:name="android.intent.category.DEFAULT" />
              ...
              <category android:name="android.intent.category.BROWSABLE" />
              ...
              <data ... android:scheme="http" ... />
              ...
            </intent-filter>
    - pattern-not: |
        <intent-filter ... android:autoVerify="true" ...>
          ...
        </intent-filter>
