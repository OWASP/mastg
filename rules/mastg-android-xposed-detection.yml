rules:
  - id: mastg-android-xposed-detection-foreign-dex-in-maps
    severity: WARNING
    languages: [java]
    metadata:
      summary: /proc/self/maps inspection combined with /data/app/ path checks
    message: "[MASVS-RESILIENCE-4] The app references /proc/self/maps and /data/app/ — the canonical primitive pair for detecting a foreign module APK (LSPosed module) mmapped into the process."
    patterns:
      - pattern: $STR
      - metavariable-regex:
          metavariable: $STR
          regex: '^"(/proc/self/maps|/data/app/)"$'

  - id: mastg-android-xposed-detection-stack-trace-probe
    severity: WARNING
    languages: [java]
    metadata:
      summary: Stack-trace inspection for instrumentation-framework class names
    message: "[MASVS-RESILIENCE-4] The app inspects stack traces (Thread.getAllStackTraces / Throwable.getStackTrace / StackTraceElement.getClassName) for instrumentation-framework class names. Common anti-hooking primitive."
    pattern-either:
      - pattern: $T.getAllStackTraces()
      - pattern: $F.getClassName()

