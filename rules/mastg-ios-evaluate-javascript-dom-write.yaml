rules:
  - id: mastg-ios-evaluate-javascript-dom-write
    languages:
      - swift
    severity: WARNING
    metadata:
      summary: evaluateJavaScript assigns data into a DOM element, exposing it to page JavaScript.
    message: >
      [MASVS-PLATFORM-2] evaluateJavaScript writes data into a DOM element (innerHTML, textContent, or value).
      Any JavaScript running on the page can read data written into DOM elements.
      Display sensitive information using a native UIKit or SwiftUI view overlay instead.
    patterns:
      - pattern: "$WEBVIEW.evaluateJavaScript($SCRIPT, completionHandler: $HANDLER)"
      - metavariable-regex:
          metavariable: $SCRIPT
          regex: '.*(\.innerHTML\s*=|\.textContent\s*=|\.innerText\s*=|\.value\s*=)'
