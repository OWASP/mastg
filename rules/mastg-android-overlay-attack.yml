rules:
  - id: mastg-android-missing-filterTouchesWhenObscured
    severity: WARNING
    languages:
      - xml
    metadata:
      summary: The rule checks if filterTouchesWhenObscured is missing or set to false on sensitive layout elements.
      masvs:
        - "MASVS-PLATFORM-2"
    message: |
      [MASVS-PLATFORM-2] Missing `android:filterTouchesWhenObscured="true"` in layout XML.
      The application may be vulnerable to tapjacking attacks. Ensure that sensitive views
      explicitly set `android:filterTouchesWhenObscured="true"` to block obscured touch events.
    patterns:
      - pattern-regex: |
          (?s)<(EditText|Button|View|TextView|ImageButton|CheckBox|RadioButton|Spinner)[^>]*>
      - pattern-not-regex: |
          android:filterTouchesWhenObscured\s*=\s*"(true|True|TRUE)"
