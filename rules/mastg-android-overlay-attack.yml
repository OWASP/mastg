rules:
  - id: mastg-android-missing-filterTouchesWhenObscured
    severity: WARNING
    languages:
      - xml
    metadata:
      summary: This rule detects sensitive layout elements missing `android:filterTouchesWhenObscured="true"`, leaving them vulnerable to tapjacking.
      masvs:
        - "MASVS-PLATFORM-2"
    message: |
      "[MASVS-PLATFORM-2] Missing `android:filterTouchesWhenObscured=\"true\"` in layout XML."
    patterns:
      - pattern-regex: |
          (?s)<(EditText|Button|View|TextView|ImageButton|CheckBox|RadioButton|Spinner)[^>]*>
      - pattern-not-regex: |
          android:filterTouchesWhenObscured\s*=\s*"(true|True|TRUE)"
