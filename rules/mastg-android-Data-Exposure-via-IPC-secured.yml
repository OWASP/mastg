rules:
  - id: mastg-android-provider-exported-true
    languages: [xml]
    severity: INFO
    metadata:
      summary: Detects an exported ContentProvider.
      masvs:
        - MASVS-PLATFORM
    message: >
      [MASVS-PLATFORM] The ContentProvider is explicitly exported. Verify that
      exported access is intended and protected with appropriate permissions.
    pattern: |
      <provider ... android:exported="true" ... />

  - id: mastg-android-provider-permission-protected
    languages: [xml]
    severity: INFO
    metadata:
      summary: Detects provider-level permission protection on a ContentProvider.
      masvs:
        - MASVS-PLATFORM
    message: >
      [MASVS-PLATFORM] The ContentProvider declares permission protection.
      Verify that the permission strength matches the intended trust boundary.
    pattern-either:
      - pattern: |
          <provider ... android:permission="$PERM" ... />
      - pattern: |
          <provider ... android:readPermission="$PERM" ... />
      - pattern: |
          <provider ... android:writePermission="$PERM" ... />

  - id: mastg-android-signature-protection-level
    languages: [xml]
    severity: INFO
    metadata:
      summary: Detects a custom permission declared with signature protection level.
      masvs:
        - MASVS-PLATFORM
    message: >
      [MASVS-PLATFORM] A custom permission is declared with
      android:protectionLevel="signature", restricting access to apps signed with
      the same certificate.
    pattern: |
      <permission ... android:protectionLevel="signature" ... />

  - id: mastg-android-provider-grant-uri-permissions
    languages: [xml]
    severity: INFO
    metadata:
      summary: Detects grantUriPermissions enabled on a ContentProvider.
      masvs:
        - MASVS-PLATFORM
    message: >
      [MASVS-PLATFORM] The ContentProvider enables URI-based permission grants.
      Verify that granted paths are intentionally limited.
    pattern: |
      <provider ... android:grantUriPermissions="true" ... />

  - id: mastg-android-provider-grant-uri-permission-tag
    languages: [xml]
    severity: INFO
    metadata:
      summary: Detects path-scoped URI permission grants on a ContentProvider.
      masvs:
        - MASVS-PLATFORM
    message: >
      [MASVS-PLATFORM] The ContentProvider defines a scoped
      <grant-uri-permission> element.
    pattern: |
      <grant-uri-permission ... />