rules:
  - id: mastg-android-data-exposure-via-ipc-read
    severity: WARNING
    languages: [java]
    metadata:
      summary: Detects the vulnerable file-read IPC demo path in the reversed MASTG sample.
      masvs:
        - "MASVS-STORAGE"
    message: |
      [MASVS-STORAGE] The demo indicates sensitive data is exposed through a file-based ContentProvider read path.
      Verify internal files are not exposed through exported providers without access restrictions.
    pattern: |
      r.add(Status.FAIL, "Initialized secret.txt and seeded creds. App exposes them via exported ContentProviders (IPC). Try: content://org.owasp.mastestapp.credentials/credentials and content://org.owasp.mastestapp.files/files/secret.txt");