rules:
  - id: mastg-android-overlay-protection
    severity: WARNING
    languages:
      - java
    metadata:
      summary: This rule detects if Tapjacking protection is implemented.
    message: "[MASVS-PLATFORM-2] Tapjacking protection detected!"
    patterns:
      - pattern: |
          public boolean onFilterTouchEventForSecurity(android.view.MotionEvent $EVENT) {
            ...
          }

      - pattern-inside: |
          public boolean onFilterTouchEventForSecurity(...) {
            ...
            // Matches the decompiled pattern: if ((event.getFlags() & 1) != 0 || ...)
            if (<... $EVENT.getFlags() & $FLAG ...>) {
              ...
              // 3. Crucial: Must return false to block the touch
              return false;
            }
            ...
          }

      - metavariable-regex:
          metavariable: $FLAG
          regex: "^(1|2)$"