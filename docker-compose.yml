services:
  mastg-generator:
    build: .
    volumes:
      - .:/app
      # To avoid downloading MASVS at runtime, uncomment the following line and ensure
      # the 'MASVS' directory (containing OWASP_MASVS.yaml) exists in the current directory.
      # - ./MASVS:/app/MASVS
    environment:
      # Points to the mounted directory. The script will look for OWASP_MASVS.yaml inside.
      - MASVS_LOCAL_PATH=/app/MASVS
    command: python3 src/scripts/yaml_to_excel.py
